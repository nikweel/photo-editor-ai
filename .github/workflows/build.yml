name: Build
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-14, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Version
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#app-v}"; [ "$GITHUB_REF_TYPE" = tag ] || V=0.0.0-dev
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
      - name: Tests
        run: uv run --python 3.12 pytest -q
      - name: Build bundle
        run: uv run --python 3.12 --with pyinstaller pyinstaller --noconfirm packaging.spec
      - name: Self-test of the built app (Linux)
        if: matrix.name == 'linux'
        run: |
          # Qt needs these system libraries (the .deb declares them as dependencies); a bare CI runner lacks libEGL
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          QT_QPA_PLATFORM=offscreen dist/Photo-Editor-AI/Photo-Editor-AI --selftest
      - name: Self-test of the built app (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Photo-Editor-AI\Photo-Editor-AI.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed: exit code $($p.ExitCode)" }
      - name: Self-test of the built app (macOS)
        if: startsWith(matrix.name, 'macos')
        run: QT_QPA_PLATFORM=offscreen dist/Photo-Editor-AI.app/Contents/MacOS/Photo-Editor-AI --selftest
      - name: Linux packages (.deb and AppImage)
        if: matrix.name == 'linux'
        run: sh packaging/linux.sh "$APP_VERSION"
      - name: Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows.iss
      - name: macOS dmg
        if: startsWith(matrix.name, 'macos')
        run: |
          mkdir -p release
          hdiutil create -volname "Photo Editor AI" -srcfolder dist/Photo-Editor-AI.app -ov -format UDZO "release/Photo-Editor-AI-$APP_VERSION-${{ matrix.name }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
  checksums:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SHA256SUMS.txt
